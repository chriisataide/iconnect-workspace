[project]
name = "iconnect-workspace"
version = "1.0.0"
description = "iConnect Workspace — a vida corporativa da empresa em um lugar"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "iconnect_workspace.settings.dev"
python_files = ["test_*.py"]
testpaths = ["workspace", "identidade", "contas", "financas", "resultados", "cargas"]

# `--cov-fail-under` global existe só como rede: o gate que vale é o piso POR APP
# em [tool.coverage_ratchet], verificado por scripts/check_coverage_ratchet.py.
# Um único piso global deixa um app regredir enquanto outro sobe, e foi assim que
# apps inteiros ficaram sem proteção nenhuma no projeto anterior.
addopts = """
    -v --tb=short --strict-markers
    --cov=workspace --cov=identidade --cov=contas --cov=financas
    --cov=resultados --cov=cargas
    --cov-report=term-missing --cov-report=json:coverage.json
    --cov-fail-under=90.0
    --junitxml=junit.xml
"""

markers = [
    "slow: marca testes lentos (desmarque com -m 'not slow')",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "iconnect_workspace/wsgi.py",
    "iconnect_workspace/asgi.py",
]

[tool.coverage_ratchet]
# Piso de cobertura POR APP. Ratchet: só sobe, nunca desce.
# Baixar qualquer valor exige justificativa explícita no PR.
#
# Herdado do projeto anterior, com uma diferença importante: lá o piso global era
# 65% porque `dashboard` e `fsm` puxavam a média para baixo. Aqui não existe esse
# lastro — todo app deste repositório nasceu com gate, e o número reflete isso.
#
# A lição que fixou estes valores: `dashboard` ficou em 66% justamente porque
# nasceu sem gate, e cobertura perdida não se recupera depois. Segurar 95% desde
# a primeira linha custa pouco; voltar de 60% para 95% nunca acontece.
#
# Medido em SQLite local. O CI roda PostgreSQL e tende a medir um pouco MAIS.
identidade = 99.0  # medido 100.00 · IDN — pode(), organograma, delegação
workspace = 98.0   # medido 98.20 · WKS — superfície + contrato de provider

# Apps novos da separação, medidos em 100,00% — models, admin e provider.
# Piso em 95 pela mesma razão do `workspace`: são apps pequenos hoje, e é agora
# que segurar cobertura custa pouco.
contas = 97.0      # medido 97.37 · modelo de usuário, manager e admin
financas = 99.0    # medido 100.00 · centro de custo, lançamento, provider

# Apps da onda de ingestão. Nascem com piso alto de propósito: a lição fixada
# lá em cima é que cobertura perdida não se recupera, e é AGORA que segurá-la
# custa pouco. Aqui custou meia hora — os buracos eram o parsing de coluna e a
# saída do comando, e os testes que os fecharam são os que provam que uma data
# lida ao contrário não põe o resultado de abril em março.
resultados = 99.0  # medido 99.27 · espelho, layer, providers
cargas = 97.0      # medido 97.39 · conectores, carregador, transporte

# 2026-08-17 — pisos elevados de 95 para perto do medido, que é o que o ratchet
# existe para fazer: enquanto o piso ficou 3,7 pontos abaixo do real, ele deixava
# passar a remoção de dezenas de linhas de teste sem reprovar nada. A folga é de
# menos de um ponto de propósito — o CI roda PostgreSQL e tende a medir um pouco
# MAIS que o SQLite local, então a margem real é maior que a que aparece aqui.

[tool.test_count_ratchet]
# Piso de QUANTIDADE de testes coletados. Existe porque cobertura NÃO detecta
# remoção de teste: no projeto anterior, apagar um arquivo inteiro com 16 testes
# derrubou a cobertura em 0,15 ponto — os testes se sobrepõem demais. Cobertura
# pega "código novo sem teste"; contagem pega "teste que sumiu". São instrumentos
# diferentes para falhas diferentes.
#
# A contagem é de testes COLETADOS, não aprovados — independe de o ambiente ser
# SQLite ou PostgreSQL.
#
# O piso do projeto anterior era 1939, dos quais 975 eram de `workspace` e
# `identidade` — os que vieram. Os outros 964 ficaram lá com `dashboard`, `fsm` e
# `km_audit`, e por isso o número cai aqui sem que nada tenha sido perdido.
#
# 975 → 974: saiu `test_exporta_cargo_legado_como_sugestao`, que verificava o
#   pré-preenchimento de cargo a partir de `dashboard.PerfilUsuario`. A
#   funcionalidade foi embora com o model, e o teste com ela — a nota de por quê
#   ficou no lugar dele, em `test_organograma_csv.py`.
# 974 → 1001: os 27 testes de `contas` e `financas`, os dois apps que a separação
#   criou. Sem subir o piso junto, apagá-los não reprovaria nada.
# 1001 → 1200: o piso ficou 200 testes abaixo do real ao longo de várias ondas —
#   fila de atendimento, papéis, histórico, reabertura. Ratchet que não sobe é
#   ratchet desligado: apagar `test_reabertura.py` inteiro (28 testes) não
#   reprovaria nada enquanto a folga fosse essa.
# 1200 → 2400: a mesma lição, de novo e pior. Entre a auditoria de segurança, o
#   reenvio do pedido devolvido e o endereçamento, a suíte passou de 1.172 para
#   2.506 testes — e o piso ficou 1.296 abaixo do real. Com essa folga, dava para
#   apagar `test_auditoria_idor.py`, `test_reenvio.py` e `test_frescor.py`
#   inteiros e o gate continuaria verde. A folga volta a ser de ~100 testes, que
#   é o que absorve um arquivo removido de propósito sem esconder um perdido por
#   acidente.
# 2400 → 2900: a ingestão, os resultados, as exceções e os ciclos somaram 540
#   testes desde então, e a folga voltou a ser grande o bastante para esconder um
#   arquivo inteiro. `test_ciclos.py` sozinho tem 63 — com o piso em 2.400, apagá-lo
#   não reprovaria nada.
# 2900 → 2950: os 52 de `test_planos.py`. A folga volta aos ~40 de sempre.
# 2950 → 3050: os 96 de `test_metas.py`, que é o maior arquivo novo desde a
#   auditoria de segurança — e o que protege o único lugar do produto onde uma
#   grade de pessoas com nota poderia nascer sem ninguém notar.
# 3050 → 3120: os 64 do orçamento anual (`workspace` + `financas`), incluindo os
#   que provam que o teto vigente não muda sem revisão.
# 3120 → 3170: os 25 dos públicos da marca. É o menor arquivo das nove ondas, e
#   metade dele é sobre uma configuração errada que mandaria cliente para dentro
#   do portal do funcionário — vale mais que o tamanho.
# 3170 → 3190: os 14 de `conferir_integracoes`, metade deles sobre o comando NÃO
#   imprimir credencial. A saída dele existe para ser colada num chamado.
# 3190 → 3200: os 8 da CSP depois que `style-src` abriu. São os que impedem duas
#   regressões opostas: alguém fechar `style-src` de novo (o gráfico sai errado
#   em silêncio) e alguém abrir `script-src` junto.
# 3200 → 3210: os 9 do SVG que não desenhava. Metade deles renderiza a tela com
#   dado de VERDADE — a primeira versão passava sem a correção, porque sem
#   espelho a série sai vazia e não há coordenada para conferir.
# 3210 → 3240: os 35 de `test_graficos.py`, menos os 5 que saíram junto com o SVG
#   calculado à mão. O que eles seguram: tabela irmã em todo gráfico, formatação
#   pt-BR num lugar só, e o bundle não virar o pacote completo.
# 3240 → 3255: os 12 do rótulo girado, da faixa comparada e dos filtros novos.
#   Metade deles só passou a valer depois de o CENÁRIO ficar rico o bastante —
#   com seis meses e um serviço, eles passavam sem provar nada.
# 3255 → 3280: os 27 do resto do catálogo — cascata, composição, empilhada,
#   rosca, medidor, bullet, dispersão, farol e mapa de calor. Cada tipo tem um
#   teste do caso vazio e um da tabela irmã, que são as duas regras que não
#   mudam com o tipo.
# 3280 → 3300: os 17 da perfuração. Um deles — o que agrupa por nível — reprovou
#   e encontrou um `OU` onde devia haver hierarquia em `_recortar`: descer para
#   um centro de custo devolvia os contratos do vizinho.
# 3300 → 3325: os 25 de cruzar, pivotar e detalhar. O que mais protege é o que
#   compara o total do detalhe com o do agregado — detalhe que não bate destrói
#   a confiança na tela inteira.
# 3325 → 3430: as telas irmãs (quadro e satisfação), o trilho que recolhe, os
#   rótulos legíveis e o conector do PNCP.
# 3430 → 3436: os 3 do isolamento por UF, mais os 3 que já vieram com o
#   conector. Os do isolamento nasceram de uma medição, não de uma hipótese: a
#   API do PNCP alternou 200, 500 e 503 no mesmo minuto, e sem eles nada
#   impediria alguém de simplificar `coletar` de volta ao laço ingênuo — em que
#   um estado fora do ar descarta os outros vinte e seis, toda madrugada.
# 3436 → 3442: os 3 do respiro longo. Um deles confere que a retomada é da
#   MESMA página e não da UF inteira — a versão ingênua passaria no teste de
#   "nada se perdeu" e releria as 109 páginas de São Paulo gastando exatamente
#   a cota que estava em falta.
# 3442 → 3451: os 9 do filtro de editais. Metade deles é sobre uma tela que
#   MENTE em silêncio — o corte mudo de 526 para 40, e a frase "a carga não
#   rodou" mostrada a quem só tinha cruzado dois filtros. Nenhum dos dois
#   parece defeito para quem olha a tela, e é por isso que precisam de teste.
# 3451 → 3452: o do vocabulário da tela de marketing. Ele segura o RÓTULO e não
#   a função — a tela chamava de "oportunidade" tanto o convite de feira quanto
#   o edital de licitação, e as duas listas ficam uma embaixo da outra.
# 3452 → 3516: as fases 1 a 5 de Resultados (área, filtros, gráficos,
#   comparativo). Os que mais protegem, e por quê:
#   · o que soma as áreas e exige que fechem o TOTAL — número que some ao
#     filtrar é o jeito mais rápido de a diretoria parar de acreditar na tela;
#   · o do vazamento do `OU`, que foi REPRODUZIDO antes de corrigido: o gerente
#     do CC 1042 via a receita da regional inteira, e os dois números nunca
#     aparecem lado a lado para alguém notar;
#   · a guarda de `{@}` em tooltip, com um teste que confere que a própria
#     guarda reprova quando o defeito existe, e outro que falha se um tipo novo
#     de gráfico entrar no catálogo sem entrar na varredura;
#   · o que exige 3,0:1 entre Realizado e Orçado — a paleta pedida na revisão
#     dava 1,33:1, e em escala de cinza as duas barras viravam uma só.
# 3524 → 3566: o bloco D (plano de contas, tabela contábil, razão na massa) e
#   os cinco serviços do A4. Os que mais protegem:
#   · o que confere a reconciliação em TODA competência, e não numa amostra —
#     o erro de arredondamento da decomposição não aparece em todo mês, e uma
#     amostra o acharia numa execução e não na seguinte;
#   · o que exige que a soma das contas seja o grupo: expandir mostrando um
#     número diferente do que estava fechado é a pior surpresa possível;
#   · os dois de idempotência do seeder, mesmo dia e DIA SEGUINTE. O segundo é
#     o caso que um defeito real produzia — a avaliação com data derivada de
#     `hoje` e chave fixa —, e ele ficou escondido justamente porque a suíte
#     semeava uma vez, num dia só;
#   · o que reprova se alguma linha do razão cair em "conta não cadastrada":
#     esse caminho existe para o dia em que a fonte real mandar código novo, e
#     não para a massa se enganar sozinha (431 linhas já nasceram assim).
# 3566 → 3580: a cascata da DRE (C6) e os controles da tabela (D3). O que mais
#   protege é o que exige que o degrau "Indireto" saia das linhas SEM contrato:
#   a primeira versão o tirava da conta e dava 88 mil, enquanto a faixa logo
#   acima mostrava 234 mil — o mesmo grupo carrega custo direto de contrato e
#   rateio de administração, e o que faz um custo ser indireto é a linha não
#   ter contrato. Mais o que confere que a cascata FECHA no mesmo número da
#   tabela: são duas leituras da mesma aritmética na mesma faixa, e se
#   discordarem ninguém sabe qual está errada.
# 3580 → 3603: a frase de leitura (B2) e a correção da margem de contribuição.
#   Metade dos testes novos afirma o SILÊNCIO — o caso em que a regra não deve
#   falar —, que é o caso difícil e o único que mantém a frase honesta. E um
#   deles pegou uma falha real do meu limiar: com dois contratos caindo igual,
#   cada um pesava 50% e a frase nomearia um dos dois arbitrariamente.
# 3603 → 3624: a concentração (E1) e a categoria positiva de destaque. Os que
#   mais protegem: o que afirma que `eco.ler` NÃO dá direito de marcar — uma
#   lista de foco que qualquer um edita deixa de ser foco —, e o que exige
#   motivo ao abrir e resultado ao encerrar, que são os dois campos sem os
#   quais o histórico vira uma lista de datas.
# 3624 → 3635: o comparativo trimestral (F2). O que mais protege é o que exige
#   PELO MENOS UM trimestre com dois anos antes de desenhar: com a janela de
#   doze meses havia 2026 e 2025 na série e nenhum trimestre com os dois, e o
#   gráfico saía com quatro barras de um ano ao lado de uma de outro — pior que
#   gráfico nenhum. E o que confere que a barra parcial é marcada ALÉM da cor:
#   opacidade e tracejado somem em preto-e-branco, o texto é o que sobra.
# 3635 → 3656: o painel da empresa (I1/I2). O que mais protege: o que exige as
#   DUAS comparações em todo número — uma só induz a erro num negócio com
#   sazonalidade —, o que confere que as faixas de vencimento não contam o
#   mesmo contrato três vezes, e o que afirma o teto de nove blocos: a décima
#   informação sempre parece necessária, e é ela que faz o CEO parar de abrir a
#   tela.
# 3656 → 3666: o catálogo de equipamentos (H1). Cinco deles guardam as respostas
#   da conferência de 09/09/2026 — LPR e térmica entram, cerca elétrica é
#   escopo, eclusa e torniquete são itens diferentes, a central é própria —,
#   para que remover um deles achando que a ADB não vende reprove com a data da
#   conferência junto.
# 3666 → 3678: as três colunas orçadas (C2/C3) e as safras (C5). O que mais
#   protege é o que virou do avesso: `test_o_ebitda_nao_ganha_par_inventado`
#   garantia que o gráfico NÃO tinha par enquanto o espelho não trazia a
#   coluna. A coluna chegou, e ele passou a guardar a outra metade da mesma
#   regra — a barra do orçado só existe quando o espelho a traz, e sem ela o
#   mês fica sem barra em vez de com um zero que seria lido como "não cumpriu
#   nada".
# 3678 → 3682: os 4 do custo anulável. O que mais protege é o que exige que a
#   SOMA ignore o desconhecido: somá-lo como zero faria o total de um mês com
#   custo ausente parecer completo, e o aviso na tela diria que falta linha
#   enquanto o número dizia que não.
# 3682 → 3731: a defesa de território, mais o que as outras telas ganharam
#   fora destas sessões. Os que mais protegem a defesa: o que exige que quem
#   NÃO tem `eco.satisfacao` veja a tabela financeira inteira e o dado de
#   pesquisa nem chegue ao HTML — sem ele, a defesa reabriria por uma porta
#   lateral o acoplamento que a separação das telas 16 e 17 desfez; e o que
#   afirma que "sem pesquisa" é `None` e não NPS zero, porque zero seria lido
#   como "metade promotor, metade detrator".
# 3731 → 3741: o `+` do escopo e a natureza da receita. O que mais protege é o
#   que exige que o mapa `servico → natureza` cubra o enum INTEIRO: serviço
#   novo sem entrada nele apareceria como "—" na coluna, e ninguém notaria que
#   a linha perdeu a informação que decide a ação da defesa.
# 3741 → 3743: o corte de quinze colunas para sete. O que mais protege é a
#   contagem de `<th scope="col">`: cada coluna nova precisa passar por ela e
#   justificar a largura que tira das outras — foi somando uma de cada vez que
#   a tabela chegou a 68rem e virou algo que se rola, não que se varre.
# 3743 → 3747: a gaveta de filtros. O que mais protege são os dois testes de
#   POSIÇÃO: um exige que os campos nasçam depois da abertura da gaveta, o
#   outro que "PDF" e "Apresentar" nasçam antes dela. Filtro e ação parecem a
#   mesma coisa numa barra de botões, e o dia em que alguém arrastar "PDF" para
#   dentro da gaveta, imprimir passa a exigir abrir os filtros.
# 3747 → 3751: a jornada por área e por contrato. O que mais protege é o que
#   exige que filtrar por área NÃO esvazie a faixa: a causa do defeito era a
#   massa não ligar nenhum apontamento a contrato, e `serie_apontamentos`
#   descartar os totais de centro de custo quando o recorte é por área — o que
#   está CERTO, porque um total de CC não se atribui a uma área sem inventar o
#   rateio. Sem esse teste, a massa volta a ser só total de CC no dia em que
#   alguém mexer no semeador, e a tela volta a responder em branco.
# 3751 → 3753: o `<br>` literal no tooltip da dispersão. O que mais protege é
#   a trava GERAL — nenhum gráfico manda `<br`, `<b>`, `<span`, `<div` ou
#   `&lt;` no JSON da série. O defeito específico já tem o seu teste, mas foi
#   por esse caminho que a marcação entrou, e é a família de defeito que passa
#   verde porque não levanta exceção: só fica feio numa tela que ninguém abre
#   com frequência.
minimo = 3753
